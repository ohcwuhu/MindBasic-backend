    - data:
        code: "import json, re\n\n_KEEP = (\"risk_level\", \"risk_reason\", \"needs_safety_check\"\
          ,\n         \"stage\", \"goal_clear\", \"action_ready\", \"should_summarize\"\
          , \"summary_reason\")\n_BOOL_KEYS = (\"needs_safety_check\", \"goal_clear\"\
          , \"action_ready\", \"should_summarize\")\n\n\ndef _bool(v):\n    if isinstance(v,\
          \ bool):\n        return v\n    return str(v).strip().lower() in (\"true\"\
          , \"1\", \"yes\", \"y\", \"是\", \"开启\", \"打开\")\n\n\ndef main(text: str)\
          \ -> dict:\n    s = re.sub(r\"<!--dify-deepseek-reasoning-->\", \" \", text\
          \ or \"\")\n    s = re.sub(r\"<think>.*?</think>\", \" \", s, flags=re.S\
          \ | re.I)\n\n    blocks, i = [], 0\n    while i < len(s):\n        if s[i]\
          \ != \"{\":\n            i += 1\n            continue\n        depth = 0\n\
          \        for j in range(i, len(s)):\n            if s[j] == \"{\":\n   \
          \             depth += 1\n            elif s[j] == \"}\":\n            \
          \    depth -= 1\n                if depth == 0:\n                    blocks.append(s[i:j\
          \ + 1])\n                    break\n        i += 1\n\n    for block in reversed(blocks):\n\
          \        try:\n            raw = json.loads(block)\n        except Exception:\n\
          \            continue\n        if not isinstance(raw, dict) or not raw or\
          \ set(raw) == {\"type\"}:\n            continue\n        out = {}\n    \
          \    for k in _KEEP:\n            if k not in raw:\n                continue\n\
          \            v = raw[k]\n            out[k] = _bool(v) if k in _BOOL_KEYS\
          \ else (v.strip() if isinstance(v, str) else v)\n        if out:\n     \
          \       return out\n    return {}"
